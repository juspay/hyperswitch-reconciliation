name: "[CI] PR Title"

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
  merge_group:
    types:
      - checks_requested

env:
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  convention:
    name: Conventional commit check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cocogitto
          checksum: true

      - name: Configure git identity for cog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify PR title follows conventional commit standards
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: cog verify "$TITLE"

      - name: Verify PR title has a lowercase type, a scope, and a capitalized message
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$TITLE" | grep -qE '^[a-z]+\([^)_]+\)!?: [A-Z]'; then
            echo "PR title must match 'type(scope): Message' — type must be lowercase, scope is required and must use hyphens instead of underscores, and the message must start with a capital letter." >&2
            exit 1
          fi

      - name: Verify commit message follows conventional commit standards
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.merge_group.head_commit.message }}
        run: cog verify "$COMMIT_MESSAGE"

      - name: Verify commit message has a lowercase type, a scope, and a capitalized message
        if: ${{ github.event_name == 'merge_group' }}
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.merge_group.head_commit.message }}
        run: |
          if ! printf '%s\n' "${COMMIT_MESSAGE%%$'\n'*}" | grep -qE '^[a-z]+\([^)_]+\)!?: [A-Z]'; then
            echo "Commit message must match 'type(scope): Message' — type must be lowercase, scope is required and must use hyphens instead of underscores, and the message must start with a capital letter." >&2
            exit 1
          fi

  spell_check:
    name: Spell check PR title
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Store PR title in a file
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" > pr_title.txt

      - name: Spell check
        uses: crate-ci/typos@b41eb62e9a8096c9ba6636e2365d3f56018a203c # master
        with:
          files: ./pr_title.txt
