name: Release a new nightly reconciliation version

on:
  schedule:
    - cron: "0 0 * * 1-5" # Weekdays at 00:00 UTC (05:30 IST)
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt a run between pushing its changelog commit and its tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Test release source
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-tests.yml

  create-nightly-tag:
    name: Create a nightly tag
    needs: tests
    uses: juspay/hyperswitch/.github/workflows/release-nightly-version-reusable.yml@main
    secrets:
      client_id: ${{ secrets.HYPERSWITCH_BOT_APP_ID }}
      app_private_key: ${{ secrets.HYPERSWITCH_BOT_APP_PRIVATE_KEY }}
