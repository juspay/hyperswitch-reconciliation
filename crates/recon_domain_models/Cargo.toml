[package]
name = "recon_domain_models"
description = "Represents the data/domain models used by the business layer"
version = "0.1.0"
edition = "2021"

[features]

[dependencies]
# First party deps
api_models = { version = "0.1.0", path = "../api_models" }
common_utils = { version = "0.1.0", path = "../common_utils", features = ["async_ext"] }
common_enums = { version = "0.1.0", path = "../common_enums" }
common_types = { version = "0.1.0", path = "../common_types" }
diesel_models = { version = "0.1.0", path = "../diesel_models" }
masking = { git = "https://github.com/juspay/hyperswitch.git",tag = "2025.10.22.0" }
recon_derive = { version = "0.1.0", path = "../recon_derive" }

# Third party deps
async-trait = "0.1.92"
error-stack = "0.4.1"
futures = "0.3.31"
http = "0.2.12"
rustc-hash = "1.1.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "1.0.140"
time = { version = "0.3.41", features = ["serde"] }
tracing = { version = "0.1.41" }
thiserror = "2.0"

[lints]
workspace = true
