[package]
name = "api_models"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.11"
actix-multipart = { version = "0.7", features = ["derive"] }
http = "0.2.12"
mime = "0.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
strum = { version = "0.27.1", features = ["derive"] }
time = { version = "0.3.47", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
utoipa = { version = "6.0.0", features = ["chrono", "uuid", "time"] }

common_enums = { path = "../common_enums", version = "0.1.0" }
common_types = { path = "../common_types", version = "0.1.0" }
common_utils = { path = "../common_utils", version = "0.1.0" }
masking = { package = "hyperswitch_masking", version = "0.0.1", features = ["serde", "diesel", "time"] }

[lints]
workspace = true
