[package]
name = "diesel_models"
version = "0.1.0"
edition = "2021"

[dependencies]
diesel = { version = "2.3.2", features = ["postgres", "time", "serde_json", "uuid", "numeric"] }
bigdecimal = "0.4"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "1.0"
time = "0.3.41"
uuid = { version = "1.0", features = ["v4", "serde"] }

common_enums = { path = "../common_enums", version = "0.1.0" }
common_types = { path = "../common_types", version = "0.1.0" }
common_utils = { path = "../common_utils", version = "0.1.0" }
async-bb8-diesel = "0.2.1"
error-stack = "0.4.1"
thiserror = "2.0.12"
futures = "0.3"
masking = { git = "https://github.com/juspay/hyperswitch.git", tag = "2025.10.22.0" }

[dev-dependencies]
rstest = "0.25"

[lints]
workspace = true
