[package]
name = "recon_interfaces"
version = "0.1.0"
edition = "2021"

[features]

[dependencies]
actix-web = "4.11.0"
async-trait = "0.1.92"
bytes = "1.10.1"
dyn-clone = "1.0.19"
error-stack = "0.4.1"
