[package]
name = "recon_interfaces"
version = "0.1.0"
edition = "2021"

[features]

[dependencies]
actix-web = "4.11.0"
async-trait = "0.1.92"
bytes = "1.11.1"
dyn-clone = "1.0.19"
error-stack = "0.8.0"
http = "0.2.12"
mime = "0.3.17"
reqwest = "0.13.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
strum = { version = "0.26", features = ["derive"] }
thiserror = "1.0.69"
time = "0.3.47"

# First party crates
masking = { package = "hyperswitch_masking", version = "0.0.1", features = ["serde", "diesel", "time"] }
common_utils = { version = "0.1.0", path = "../common_utils" }

[lints]
workspace = true
