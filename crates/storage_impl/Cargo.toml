[package]
name = "storage_impl"
description = "Storage implementations backing the recon store interfaces"
version = "0.1.0"
edition = "2021"

[dependencies]
# First party deps
common_enums = { version = "0.1.0", path = "../common_enums" }
common_types = { version = "0.1.0", path = "../common_types" }
common_utils = { version = "0.1.0", path = "../common_utils" }
diesel_models = { version = "0.1.0", path = "../diesel_models" }
masking = { package = "hyperswitch_masking", version = "0.0.1", features = ["serde", "diesel", "time"] }

# Third party deps
async-bb8-diesel = "0.2"
async-trait = "0.1.92"
bb8 = "0.8"
diesel = { version = "2.3.10", features = ["postgres"] }
error-stack = "0.8.0"
futures = "0.3"
time = "0.3.47"

[lints]
workspace = true
