[package]
name = "external_services"
version = "0.1.0"
edition = "2021"

[dependencies]
common_utils = { path = "../common_utils" }
common_types = { path = "../common_types" }
masking = { git = "https://github.com/juspay/hyperswitch.git",tag = "2025.10.22.0" }
recon_domain_models = { path = "../recon_domain_models" }
recon_interfaces = { path = "../recon_interfaces" }
async-trait = "0.1.92"
error-stack = "0.4.1"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "1.0" } 
thiserror = "2.0"
strum = { version = "0.26", features = ["derive"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
once_cell = "1.21.3"
reqwest = { version = "0.13.5", features = ["rustls", "native-tls-no-alpn", "form", "query"] }
url = { version = "2.5.4", features = ["serde"] }
quick-xml = { version = "0.31.0", features = ["serialize"] }
hyper = "1.6.0"
tracing = { version = "0.1.41" }
sha2 = "0.10"
time = "0.3.41"
oci_kms = { git = "https://github.com/juspay/hyperswitch.git", rev = "9986e5c0c201a20d2f7c06ae087d7b90fd2e899c" }

# AWS dependencies
aws-config = "1.6.0"
aws-sdk-kms = "1.0"
aws-sdk-lambda = "1.0"
aws-sdk-s3 = "1.0"
aws-smithy-types = "1.3"

# Invokr scheduler SDK
invokr_sdk = { git = "https://github.com/juspay/invokr.git", tag = "v0.5.0" }

[dev-dependencies]
tempfile = "3.0"

[features]

[lints]
workspace = true
