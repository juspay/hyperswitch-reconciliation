[package]
name = "external_services"
version = "0.1.0"
edition = "2021"

[dependencies]
common_utils = { path = "../common_utils" }
common_types = { path = "../common_types" }
masking = { git = "https://github.com/juspay/hyperswitch.git",tag = "2025.10.22.0" }
recon_domain_models = { path = "../recon_domain_models" }
recon_interfaces = { path = "../recon_interfaces" }
async-trait = "0.1.92"
error-stack = "0.4.1"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "1.0" } 
thiserror = "2.0"
strum = { version = "0.26", features = ["derive"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
once_cell = "1.21.3"
reqwest = { version = "0.11.27", features = ["rustls-tls"] }
url = { version = "2.5.4", features = ["serde"] }
quick-xml = { version = "0.31.0", features = ["serialize"] }
hyper = "0.14.32"
tracing = { version = "0.1.41" }
sha2 = "0.10"

# AWS dependencies
aws-config = "1.0" 
aws-sdk-kms = "1.0"
aws-sdk-lambda = "1.0"
aws-sdk-s3 = "1.0"

[dev-dependencies]
tempfile = "3.0"

[features]

[lints]
workspace = true
