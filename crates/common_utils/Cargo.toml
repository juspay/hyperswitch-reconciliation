[package]
name = "common_utils"
version = "0.1.0"
edition = "2021"

[dependencies]
masking = { git = "https://github.com/juspay/hyperswitch.git",tag = "2025.10.22.0" }
time = { version = "0.3.41", features = ["serde"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
tracing-log = "0.2.0"
error-stack = "0.4.1"
base64 = "0.22"
rustc-hash = "1.1.0"
blake3 = { version = "1.8.2", features = ["serde"] }
hex = "0.4.3"
thiserror = "2.0.12"
md5 = "0.7.0"
nanoid = "0.4"
ring = { version = "0.17.14", features = ["std", "wasm32_unknown_unknown_js"] }
rand = "0.8.5"
diesel = "2.3.2"
globset = "0.4.16"
regex = "1.11.1"
phonenumber = "0.3.7"
once_cell = "1.21.3"
reqwest = { version = "0.11.27", features = ["json", "native-tls", "gzip", "multipart", "rustls-tls"] }
http = "0.2.12"
bytes = "1.10.1"
futures = { version = "0.3.31", optional = true }
async-trait = { version = "0.1.92", optional = true }
serde_urlencoded = "0.7.1"
quick-xml = { version = "0.31.0", features = ["serialize"] }
utoipa = { version = "4.2.3", features = ["preserve_order", "preserve_path_order"] }
strum = { version = "0.26.3", features = ["derive"] }

[dev-dependencies]
fake = "2.10.0"
proptest = "1.6.0"
test-case = "3.3.1"

[features]
async_ext = ["dep:async-trait", "dep:futures"]

[lints]
workspace = true
