[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
rstest = "0.18"
pretty_assertions = "1.4"

[workspace.lints.clippy]
as_conversions = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
expect_used = "warn"
fn_params_excessive_bools = "warn"
index_refutable_slice = "warn"
indexing_slicing = "warn"
large_futures = "warn"
missing_panics_doc = "warn"
mod_module_files = "warn"
out_of_bounds_indexing = "warn"
panic = "warn"
panic_in_result_fn = "warn"
panicking_unwrap = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
trivially_copy_pass_by_ref = "warn"
unimplemented = "warn"
unnecessary_self_imports = "warn"
unreachable = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
use_self = "warn"
wildcard_dependencies = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
async_fn_in_trait = "allow"

# hyperswitch_masking 0.0.1 on crates.io pins serde = "=1.0.228", which blocks
# invokr_sdk v0.5.1, whose Smithy dependencies need serde ^1.0.229.
# framework-libs-rs main relaxes the pin. Remove once a newer version is published.
[patch.crates-io]
hyperswitch_masking = { git = "https://github.com/juspay/framework-libs-rs.git", rev = "8c17c20ba784b142db6d29e9c5079fa2feab5fb9" }
